name: "TempHum"
manufacturer: "友讯达"
model: "温湿度传感器-20250731"
labels: ["温湿度传感器", "友讯达温湿度传感器"]
description: "温湿度传感器"

deviceResources:
  - name: "Temp"
    isHidden: true
    description: "温度值"
    properties:
      valueType: "Float32"
      readWrite: "R"
      units: "℃"
      defaultValue: "0"
  - name: "HumiAmbient"
    isHidden: true
    description: "湿度值"
    properties:
      valueType: "Float32"
      readWrite: "R"
      units: "%RH"
      defaultValue: "0"
  - name: "BatVolt"
    isHidden: true
    description: "供电电压"
    properties:
      valueType: "Float32"
      readWrite: "R"
      units: "V"
      defaultValue: "0"
  - name: "BatteryRemaining"
    isHidden: true
    description: "电池电量"
    properties:
      valueType: "Uint16"
      readWrite: "R"
      units: "%"
      defaultValue: "0"
  - name: "heatbeat"
    isHidden: true
    description: "传感器运行状态"
    properties:
      valueType: "Uint8"
      readWrite: "R"
      units: "code"
      defaultValue: "0"
  - name: "eid"
    isHidden: true                    
    description: "设备标识"
    properties:
      valueType: "String"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "238A0821BF34"               
  - name: "AsyncData"
    isHidden: true
    description: "资源上传通道"
    properties:
      valueType: "Uint16"  
      readWrite: "R"
      units: ""
      defaultValue: "0"
  - name: "Heartbeat"
    isHidden: true
    description: "心跳通道"
    properties:
      valueType: "Uint16"  
      readWrite: "R"
      units: ""
      defaultValue: "0"
  - name: "LastDataTs"                       # 最新时间戳(Unix 纳秒）
    isHidden: true
    description: "最新时间戳"
    properties:
      valueType: "Int64"                            # 64 位整数，纳秒级
      readWrite: "R"                                
      units: "ns"
      defaultValue: "0"
  - name: "period"
    isHidden: true
    description: "上报周期"
    properties:
      valueType: "Uint16"  
      readWrite: "R"
      units: "s"
      defaultValue: "1200"
deviceCommands:
  -
    name: "TempHum"
    readWrite: "R"
    isHidden: false
    resourceOperations:
      - { deviceResource: "Temp", defaultValue: "0" }
      - { deviceResource: "HumiAmbient", defaultValue: "0" }
      - { deviceResource: "BatVolt", defaultValue: "0" }
      - { deviceResource: "BatteryRemaining", defaultValue: "0" }
      - { deviceResource: "heatbeat", defaultValue: "0" }
      